<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbit – YouTube Downloader</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-title">Orbit</h1>
      <nav class="tabs">
        <button class="tab-btn active" data-tab="downloads">Downloads</button>
        <button class="tab-btn" data-tab="settings">Settings</button>
      </nav>
    </header>

    <main class="app-main">
      <section id="tab-downloads" class="tab-panel active">
        <div class="placeholder">
          <h2>Downloads</h2>
          <p>Queue and download controls will appear here in a later task.</p>
        </div>
      </section>

      <section id="tab-settings" class="tab-panel">
        <div class="placeholder">
          <h2>Settings</h2>
          <p>Configuration panel will appear here in a later task.</p>
        </div>
      </section>
    </main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
